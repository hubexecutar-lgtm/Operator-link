serializacao_excel:
  arrays: Normalizar em tabelas auxiliares com chave estrangeira; não separar IDs por vírgula.
  tabelas_auxiliares:
  - Registro_Macroarea(registro_id, macroarea_id, papel)
  - Registro_Secao(registro_id, secao_id)
  - Registro_Nav(registro_id, nav_id)
  - Registro_Origem(registro_id, fonte_id, localizador)
  - Registro_Legado(registro_id, legacy_id)
  - Execucao_Input(registro_id, ordem, entrada)
  - Execucao_Evidencia(registro_id, evidencia_id)
  passos: passo_1, passo_2, passo_3; converter na exportação para array ordenado.
  'null': Célula vazia para parent_id raiz e tempo desconhecido; texto A DEFINIR para campos humanos desconhecidos.
  datas: Valores tipados no Excel; exportação ISO 8601.
  formulas: Preservar lookup exato pelo ID. Implementação futura deve testar referências estruturadas para evitar
    limite fixo 151.
  compatibilidade: Excel é o alvo proposto; suporte Numbers/LibreOffice permanece não verificado após adaptação.
validacoes_entrada:
- Enums por listas de validação.
- IDs como texto; validação de padrão e unicidade.
- Chaves estrangeiras somente para registros existentes.
- Respostas e dados editáveis desbloqueados; fórmulas e IDs protegidos para reduzir edição acidental.
- Proteção de planilha é controle de edição, não segurança de dados.
integridade_entre_linhas:
- regra: IDs únicos em cada entidade
  metodo: Validador de dataset + diagnóstico no Excel.
- regra: parent_id existente, sem autorreferência e sem ciclos
  metodo: Travessia do grafo.
- regra: 'DEPENDS_ON: origem depende do destino; ambas são tarefas/ações'
  metodo: Validar tipos; ciclos bloqueiam READY.
- regra: BLOCKS é inverso derivado de DEPENDS_ON
  metodo: Não cadastrar arestas inversas redundantes.
- regra: WIP=1
  metodo: No máximo um IN_PROGRESS por escopo_wip_id.
- regra: READY exige entradas presentes e dependências VERIFIED
  metodo: Checagem de pré-condições no controlador de execução, independente de 20_Auditoria.
- regra: VERIFIED exige todas as evidências vinculadas existentes e ao menos uma VERIFICADA
  metodo: Cruzar execução e evidências; confirmar aceite ATENDIDO e identidade do registro.
- regra: Owner A DEFINIR pode existir em PREPARED, mas bloqueia início de execução
  metodo: Precondição de IN_PROGRESS.
- regra: Cobertura total do inventário
  metodo: Cada unidade tem origem e ao menos um destino VERIFICADO; unidades omitidas do caderno ficam no manual/acervo.
- regra: Consolidação rastreável
  metodo: Registro consolidado mantém origens e relações CONSOLIDA para cada unidade original.
- regra: Conflitos não resolvidos
  metodo: Bloquear apenas tarefas cujo requisito é afetado pelo conflito; não bloquear o workbook inteiro.
maquina_estados:
  NOT_READY:
  - READY
  - BLOCKED
  READY:
  - IN_PROGRESS
  - NOT_READY
  - BLOCKED
  IN_PROGRESS:
  - DECLARED_DONE
  - BLOCKED
  BLOCKED:
  - NOT_READY
  - READY
  DECLARED_DONE:
  - VERIFIED
  - IN_PROGRESS
  - BLOCKED
  VERIFIED:
  - NOT_READY
  reabertura: VERIFIED → NOT_READY requer evento com motivo e revisão do aceite.
metrica_preenchimento: Contar respostas somente nos 94 IDs catalogados; denominador calculado do catálogo. Não contar
  notas fora de registros.
metrica_execucao: Tarefas VERIFIED / total de tarefas do escopo; distinta do preenchimento.
regras_impressao:
  papel: A4
  margem_e_fonte: A DEFINIR na implementação, após render de teste.
  regras:
  - Repetir cabeçalhos em tabelas longas.
  - Impedir cortes de texto e colunas.
  - Não diminuir fonte para cumprir número artificial de páginas.
  - Reservar espaço para anotações.
  - Cada ficha contém ID e referências ao manual/acervo.
  aceite: Renderizar todas as páginas e verificar overflow; não realizado neste pacote.
